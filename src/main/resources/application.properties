spring.application.name=claudeproxy

# SQLite: файловая БД статистики, схема применяется идемпотентно (CREATE TABLE IF NOT EXISTS)
spring.datasource.url=jdbc:sqlite:data/claudeproxy.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
# SQLite — один писатель: пул в одно соединение
spring.datasource.hikari.maximum-pool-size=1

# Claude Code шлёт мегабайты контекста: лимит чтения тел запросов/ответов
spring.codec.max-in-memory-size=64MB
