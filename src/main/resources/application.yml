spring:
  application:
    name: claudeproxy

  # SQLite: файловая БД статистики; схема и миграции — db/migration/V*.sql
  # (DatabaseMigrationRunner), без spring.sql.init
  datasource:
    url: jdbc:sqlite:data/claudeproxy.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite — один писатель: пул в одно соединение
      maximum-pool-size: 1

  # Claude Code шлёт мегабайты контекста: лимит чтения тел запросов/ответов
  codec:
    max-in-memory-size: 64MB
